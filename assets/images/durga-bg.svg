<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Sky & Temple Glow Gradients -->
    <radialGradient id="durgaAuraGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff7b25" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#8a0011" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldTrishulGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9d6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f7d774" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Blur filter for soft atmospheric glow -->
    <filter id="softAtmosphere" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- ================= 1. DIVINE MAA DURGA AURA & HALO (CENTER TOP) ================= -->
  <!-- Radiant Aura Sphere -->
  <circle cx="960" cy="340" r="440" fill="url(#durgaAuraGlow)"/>
  
  <!-- Outer Sacred Mandala Sun Rays (16-Ray Sunburst) -->
  <g stroke="#d4af37" stroke-width="1.5" opacity="0.18" stroke-dasharray="8 6">
    <circle cx="960" cy="340" r="340"/>
    <circle cx="960" cy="340" r="280"/>
    <circle cx="960" cy="340" r="220"/>
    <circle cx="960" cy="340" r="160"/>
    <!-- Radiating Ray Lines -->
    <line x1="960" y1="60" x2="960" y2="620"/>
    <line x1="680" y1="340" x2="1240" y2="340"/>
    <line x1="762" y1="142" x2="1158" y2="538"/>
    <line x1="762" y1="538" x2="1158" y2="142"/>
  </g>

  <!-- Grand Central Trishul Silhouette behind Maa Durga -->
  <g stroke="url(#goldTrishulGrad)" fill="none" opacity="0.28">
    <!-- Center Spear Shaft -->
    <line x1="960" y1="80" x2="960" y2="720" stroke-width="4.5"/>
    <!-- Central Blade -->
    <path d="M960 40 L980 140 L960 180 L940 140 Z" fill="#f7d774" fill-opacity="0.22" stroke-width="2.5"/>
    <!-- Left Prong Curve -->
    <path d="M960 180 C900 180 850 130 850 60 C850 140 890 230 960 250" stroke-width="3"/>
    <path d="M850 60 L870 100 L850 120 L830 100 Z" fill="#f7d774" fill-opacity="0.22"/>
    <!-- Right Prong Curve -->
    <path d="M960 180 C1020 180 1070 130 1070 60 C1070 140 1030 230 960 250" stroke-width="3"/>
    <path d="M1070 60 L1090 100 L1070 120 L1050 100 Z" fill="#f7d774" fill-opacity="0.22"/>
  </g>

  <!-- Divine Maa Durga Face & Trinetra Motif (Iconic Centerpiece) -->
  <g transform="translate(860, 270) scale(1.25)" opacity="0.4">
    <!-- Forehead Red Vermillion Sindoor Bindi -->
    <circle cx="80" cy="38" r="10" fill="#e53935" filter="url(#softAtmosphere)"/>
    <circle cx="80" cy="38" r="9" fill="#b71c1c"/>
    <circle cx="80" cy="38" r="3" fill="#ffebee"/>

    <!-- Third Eye (Trinetra) -->
    <path d="M80 8 C88 20 88 28 80 34 C72 28 72 20 80 8 Z" fill="#f7d774" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="80" cy="22" r="3.5" fill="#b71c1c"/>

    <!-- Left Eyebrow & Fish-shaped Eye -->
    <path d="M22 46 C36 34 56 34 72 44" stroke="#f7d774" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M14 58 C28 46 54 48 72 58 C54 70 28 68 14 58 Z" fill="#ffffff" fill-opacity="0.9" stroke="#d4af37" stroke-width="2.5"/>
    <ellipse cx="44" cy="58" rx="10" ry="8.5" fill="#2d0b11"/>
    <circle cx="42" cy="56" r="2" fill="#ffffff"/>

    <!-- Right Eyebrow & Fish-shaped Eye -->
    <path d="M138 46 C124 34 104 34 88 44" stroke="#f7d774" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M146 58 C132 46 106 48 88 58 C106 70 132 68 146 58 Z" fill="#ffffff" fill-opacity="0.9" stroke="#d4af37" stroke-width="2.5"/>
    <ellipse cx="116" cy="58" rx="10" ry="8.5" fill="#2d0b11"/>
    <circle cx="114" cy="56" r="2" fill="#ffffff"/>

    <!-- Nose Ring (Nolok) hint -->
    <circle cx="80" cy="80" r="14" stroke="#f7d774" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="70" cy="88" r="2.5" fill="#e53935"/>
  </g>

  <!-- ================= 2. TRADITIONAL BENGALI ALPANA MANDALAS ================= -->
  <!-- Top Left Alpana Corner -->
  <g transform="translate(40, 40)" stroke="#d4af37" stroke-width="1.2" opacity="0.25" fill="none">
    <circle cx="80" cy="80" r="70" stroke-dasharray="4 4"/>
    <circle cx="80" cy="80" r="50"/>
    <circle cx="80" cy="80" r="30"/>
    <path d="M80 10 C90 40 90 50 80 80 C70 50 70 40 80 10 Z" fill="#d4af37" fill-opacity="0.1"/>
    <path d="M10 80 C40 90 50 90 80 80 C50 70 40 70 10 80 Z" fill="#d4af37" fill-opacity="0.1"/>
    <path d="M30 30 C55 50 60 60 80 80 C60 60 50 55 30 30 Z" fill="#d4af37" fill-opacity="0.1"/>
  </g>

  <!-- Top Right Alpana Corner -->
  <g transform="translate(1740, 40)" stroke="#d4af37" stroke-width="1.2" opacity="0.25" fill="none">
    <circle cx="70" cy="80" r="70" stroke-dasharray="4 4"/>
    <circle cx="70" cy="80" r="50"/>
    <circle cx="70" cy="80" r="30"/>
    <path d="M70 10 C80 40 80 50 70 80 C60 50 60 40 70 10 Z" fill="#d4af37" fill-opacity="0.1"/>
    <path d="M140 80 C110 90 100 90 70 80 C100 70 110 70 140 80 Z" fill="#d4af37" fill-opacity="0.1"/>
    <path d="M120 30 C95 50 90 60 70 80 C90 60 100 55 120 30 Z" fill="#d4af37" fill-opacity="0.1"/>
  </g>

  <!-- Bottom Elegant Traditional Floor Alpana Border -->
  <g stroke="#d4af37" stroke-width="1" opacity="0.18" fill="none">
    <path d="M0 1040 Q 480 1000 960 1040 T 1920 1040"/>
    <path d="M0 1060 Q 480 1020 960 1060 T 1920 1060"/>
  </g>
</svg>
