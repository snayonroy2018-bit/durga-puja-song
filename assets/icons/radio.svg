<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Vintage Valve Radio Cabinet -->
  <rect x="6" y="16" width="52" height="38" rx="4" fill="currentColor" opacity="0.15"/>
  <!-- Antenna -->
  <line x1="12" y1="16" x2="28" y2="4"/>
  <circle cx="28" cy="4" r="1.5" fill="currentColor"/>
  <!-- Speaker grille -->
  <rect x="10" y="22" width="24" height="26" rx="2"/>
  <line x1="14" y1="26" x2="30" y2="26"/>
  <line x1="14" y1="31" x2="30" y2="31"/>
  <line x1="14" y1="36" x2="30" y2="36"/>
  <line x1="14" y1="41" x2="30" y2="41"/>
  <!-- Tuning Dial -->
  <rect x="38" y="22" width="16" height="12" rx="2" fill="currentColor" opacity="0.2"/>
  <line x1="40" y1="28" x2="52" y2="28" stroke="#e5a93c" stroke-width="1.5"/>
  <circle cx="46" cy="28" r="2" fill="#e5a93c"/>
  <!-- Control Knobs -->
  <circle cx="42" cy="42" r="3.5"/>
  <circle cx="50" cy="42" r="3.5"/>
</svg>
